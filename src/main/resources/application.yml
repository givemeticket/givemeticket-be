spring:
  application:
    name: givemeticket-api
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:givemeticket}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${MYSQL_USER:givemeticket}
    password: ${MYSQL_PASSWORD:givemeticket}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    mbeanregistry:
      enabled: true

payment:
  base-url: ${PAYMENT_BASE_URL:http://localhost:8081}
  connect-timeout-ms: ${PAYMENT_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${PAYMENT_READ_TIMEOUT_MS:3000}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: givemeticket-api
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      slo:
        "[http.server.requests]": 50ms,100ms,200ms,500ms,1s,2s

logging:
  level:
    kr.givemeticket: INFO

# 로그 출력 형태(JSON/파일/콘솔)는 logback-spring.xml 이 프로파일별로 결정한다.
# exclude-patterns, masked-keys 를 지정하지 않으면 LogProperties 의 기본값이 쓰인다.
app:
  logging:
    max-body-length: ${LOG_MAX_BODY_LENGTH:4096}
