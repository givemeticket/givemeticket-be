spring:
  application:
    name: givemeticket-api
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:givemeticket}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${MYSQL_USER:givemeticket}
    password: ${MYSQL_PASSWORD:givemeticket}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    mbeanregistry:
      enabled: true

jwt:
  # 운영에서는 반드시 환경변수로 주입한다. HS256 이라 최소 32바이트가 필요하다.
  secret-key: ${JWT_SECRET_KEY:local-development-only-secret-key-32bytes}
  access-token:
    expiration: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:604800000}

external:
  kakao:
    base-url: ${KAKAO_AUTH_BASE_URL:https://kauth.kakao.com}
    rest-api-key: ${KAKAO_REST_API_KEY:kakao-rest-api-key}
    # 콘솔에서 Client Secret 을 '사용함' 으로 켰을 때만 채운다.
    client-secret: ${KAKAO_CLIENT_SECRET:}
    issuer: ${KAKAO_ISSUER:https://kauth.kakao.com}
    jwks-path: ${KAKAO_JWKS_PATH:/.well-known/jwks.json}
    jwks-cache-ttl: ${KAKAO_JWKS_CACHE_TTL:15m}
    connect-timeout: ${KAKAO_CONNECT_TIMEOUT:2s}
    read-timeout: ${KAKAO_READ_TIMEOUT:3s}
  naver:
    # 네이버는 OIDC 를 지원하지 않아 토큰 발급 후 프로필 API 를 한 번 더 부른다. 호스트가 서로 다르다.
    auth-base-url: ${NAVER_AUTH_BASE_URL:https://nid.naver.com}
    api-base-url: ${NAVER_API_BASE_URL:https://openapi.naver.com}
    client-id: ${NAVER_CLIENT_ID:naver-client-id}
    client-secret: ${NAVER_CLIENT_SECRET:naver-client-secret}
    connect-timeout: ${NAVER_CONNECT_TIMEOUT:2s}
    read-timeout: ${NAVER_READ_TIMEOUT:3s}

payment:
  base-url: ${PAYMENT_BASE_URL:http://localhost:8081}
  connect-timeout-ms: ${PAYMENT_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${PAYMENT_READ_TIMEOUT_MS:3000}

campaign:
  cache:
    # none: 캐시 없음 / redis: Redis 캐시만 / local: 로컬 캐시 + Redis + pub/sub 무효화
    # 같은 빌드로 갈아 끼우며 비교하기 위한 스위치다.
    mode: ${CAMPAIGN_CACHE_MODE:redis}
    # 무효화는 변경 시점마다 하지만, 놓친 무효화가 영원히 남지 않도록 만료를 둔다.
    ttl: ${CAMPAIGN_CACHE_TTL:10m}
    local:
      # pub/sub 은 at-most-once 라 방송을 놓칠 수 있다. 그때 낡은 값이 남는 시간의 상한이다.
      ttl: ${CAMPAIGN_LOCAL_CACHE_TTL:30s}
      # 로컬 캐시는 힙에 그대로 얹힌다. 무한정 늘어나지 않게 묶어 둔다.
      #
      # 항목 하나의 실제 힙 점유를 재 보면 (Caffeine 내부 노드 포함) 안내문 길이에 비례한다.
      #   300자 1.2KB / 800자 2.2KB / 1,500자 3.6KB / 5,000자 10.5KB
      # 6,000 개는 안내문이 전부 도메인 상한(5,000자)일 때도 61MB 로, 힙 718MB 의 8.6% 다.
      # 보통 길이(800자)라면 13MB, 1.8% 밖에 안 된다.
      #
      # 힙 크기를 바꾸면 이 숫자도 같이 봐야 한다. 기준은 "최악의 경우가 힙의 10% 이내" 다.
      max-size: ${CAMPAIGN_LOCAL_CACHE_MAX_SIZE:6000}

application:
  # apply 후 confirm까지 자리를 잡아둘 수 있는 시간. 사용자가 결제창에 머무는 시간이다.
  hold-duration: ${APPLICATION_HOLD_DURATION:2m}
  expire-scheduler-delay-ms: ${APPLICATION_EXPIRE_SCHEDULER_DELAY_MS:10000}
  expire-batch-size: ${APPLICATION_EXPIRE_BATCH_SIZE:200}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: givemeticket-api
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      slo:
        "[http.server.requests]": 50ms,100ms,200ms,500ms,1s,2s

logging:
  level:
    kr.givemeticket: INFO

app:
  logging:
    max-body-length: ${LOG_MAX_BODY_LENGTH:4096}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://givemeticket.site,https://www.givemeticket.site,http://localhost:3000,http://localhost:5173,https://givemeticket.vercel.app}
    max-age: ${CORS_MAX_AGE:1h}
