spring:
  application:
    name: givemeticket-api
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:givemeticket}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${MYSQL_USER:givemeticket}
    password: ${MYSQL_PASSWORD:givemeticket}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    mbeanregistry:
      enabled: true

jwt:
  # 운영에서는 반드시 환경변수로 주입한다. HS256 이라 최소 32바이트가 필요하다.
  secret-key: ${JWT_SECRET_KEY:local-development-only-secret-key-32bytes}
  access-token:
    expiration: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:604800000}

external:
  kakao:
    base-url: ${KAKAO_AUTH_BASE_URL:https://kauth.kakao.com}
    # 인증이 끝난 뒤의 호출(연결 끊기)은 호스트가 다르다.
    api-base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
    rest-api-key: ${KAKAO_REST_API_KEY:kakao-rest-api-key}
    # 콘솔에서 Client Secret 을 '사용함' 으로 켰을 때만 채운다.
    client-secret: ${KAKAO_CLIENT_SECRET:}
    # 탈퇴 시 카카오 연결 끊기에만 쓴다. 비우면 연결 끊기를 건너뛰므로 운영에서는 반드시 채운다.
    admin-key: ${KAKAO_ADMIN_KEY:}
    issuer: ${KAKAO_ISSUER:https://kauth.kakao.com}
    jwks-path: ${KAKAO_JWKS_PATH:/.well-known/jwks.json}
    jwks-cache-ttl: ${KAKAO_JWKS_CACHE_TTL:15m}
    connect-timeout: ${KAKAO_CONNECT_TIMEOUT:2s}
    read-timeout: ${KAKAO_READ_TIMEOUT:3s}
  naver:
    # 네이버는 OIDC 를 지원하지 않아 토큰 발급 후 프로필 API 를 한 번 더 부른다. 호스트가 서로 다르다.
    auth-base-url: ${NAVER_AUTH_BASE_URL:https://nid.naver.com}
    api-base-url: ${NAVER_API_BASE_URL:https://openapi.naver.com}
    client-id: ${NAVER_CLIENT_ID:naver-client-id}
    client-secret: ${NAVER_CLIENT_SECRET:naver-client-secret}
    connect-timeout: ${NAVER_CONNECT_TIMEOUT:2s}
    read-timeout: ${NAVER_READ_TIMEOUT:3s}

campaign:
  cache:
    # none | redis | local
    mode: ${CAMPAIGN_CACHE_MODE:local}
    ttl: ${CAMPAIGN_CACHE_TTL:10m}
    local:
      ttl: ${CAMPAIGN_LOCAL_CACHE_TTL:30s}
      max-size: ${CAMPAIGN_LOCAL_CACHE_MAX_SIZE:6000}

reservation:
  queue:
    # 좌석 선점 후 예매를 MySQL 에 저장하는 일을 요청 스레드에서 떼어내는 큐.
    stream-key: ${RESERVATION_STREAM_KEY:reservation:stream}
    group: ${RESERVATION_STREAM_GROUP:reservation-workers}
    # 아래 둘은 이름만 잡아둔 상태다. 지연 재시도와 DLQ 단계에서 쓰기 시작한다.
    delay-queue-key: ${RESERVATION_DELAY_QUEUE_KEY:reservation:retry}
    dlq-stream-key: ${RESERVATION_DLQ_STREAM_KEY:reservation:dlq}
    # XACK 은 스트림을 비우지 않는다. 이 상한이 없으면 성공한 메시지가 계속 쌓인다.
    max-length: ${RESERVATION_STREAM_MAX_LENGTH:100000}
  worker:
    # API 인스턴스 안에서 돌기 때문에 전용 풀로 가둔다. DB 커넥션 풀(기본 10)보다 작아야
    # 워커가 커넥션을 다 가져가 취소·조회가 굶는 일이 없다.
    threads: ${RESERVATION_WORKER_THREADS:2}
    batch-size: ${RESERVATION_WORKER_BATCH_SIZE:10}
    poll-timeout: ${RESERVATION_WORKER_POLL_TIMEOUT:2s}
  retry:
    # 대기 시간 = base-delay × 2^attempt + jitter(0~jitter 난수), max-delay 로 상한.
    # 난수는 상한 위에도 얹는다. 상한에 걸린 메시지가 같은 시각에 몰리는 것이
    # 애초에 피하려던 일이기 때문이다.
    base-delay: ${RESERVATION_RETRY_BASE_DELAY:1s}
    max-delay: ${RESERVATION_RETRY_MAX_DELAY:30s}
    jitter: ${RESERVATION_RETRY_JITTER:1s}
    max-attempts: ${RESERVATION_RETRY_MAX_ATTEMPTS:5}
    poll-interval-ms: ${RESERVATION_RETRY_POLL_INTERVAL_MS:1000}
    promote-batch-size: ${RESERVATION_RETRY_PROMOTE_BATCH_SIZE:100}

slack:
  # 비워 두면 알림을 보내지 않고 로그로만 남긴다. 운영에서는 반드시 채운다 —
  # 아무도 모르는 DLQ 는 없는 것과 같다.
  webhook-url: ${SLACK_WEBHOOK_URL:}
  connect-timeout-ms: ${SLACK_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${SLACK_READ_TIMEOUT_MS:3000}

admin:
  # 비워 두면 어드민 API 가 아예 열리지 않는다. 설정을 잊고 배포해도 안전하도록
  # 기본값을 빈 문자열로 둔다.
  api-key: ${ADMIN_API_KEY:}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: givemeticket-api
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      slo:
        "[http.server.requests]": 50ms,100ms,200ms,500ms,1s,2s

logging:
  level:
    kr.givemeticket: INFO

app:
  logging:
    max-body-length: ${LOG_MAX_BODY_LENGTH:4096}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://givemeticket.site,https://www.givemeticket.site,http://localhost:3000,http://localhost:5173,https://givemeticket.vercel.app}
    max-age: ${CORS_MAX_AGE:1h}
