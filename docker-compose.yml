services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          memory: 512m

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          memory: 256m

  # 백엔드는 더 이상 호출하지 않는다. 결함 주입 실험용으로 남겨둔 독립 서비스라
  # 기본 프로필에서는 뜨지 않는다.
  payment-mock:
    profiles: ["payment-mock"]
    build: ./payment-mock
    environment:
      PAYMENT_DELAY_MS: ${PAYMENT_DELAY_MS}
      PAYMENT_JITTER_MS: ${PAYMENT_JITTER_MS}
      PAYMENT_ERROR_RATE: ${PAYMENT_ERROR_RATE}
      PAYMENT_TIMEOUT_RATE: ${PAYMENT_TIMEOUT_RATE}
      PAYMENT_DECLINE_RATE: ${PAYMENT_DECLINE_RATE}
      PAYMENT_CANCEL_ERROR_RATE: ${PAYMENT_CANCEL_ERROR_RATE:-0.0}
    ports:
      - "${PAYMENT_MOCK_PORT}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          memory: 128m

  backend:
    build: .
    environment: &backend-env
      # dev 프로파일은 콘솔 + /logs/app/*.log 파일에 동시에 JSON 을 쓴다.
      # 파일이 있어야 obs 프로파일의 alloy 가 tail 할 수 있다.
      SPRING_PROFILES_ACTIVE: dev
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_POOL_SIZE: ${DB_POOL_SIZE}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:-604800000}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      JVM_HEAP_OPTS: ${JVM_HEAP_OPTS:--XX:InitialRAMPercentage=70.0 -XX:MaxRAMPercentage=70.0}
      JVM_GC_OPTS: ${JVM_GC_OPTS:--XX:+UseG1GC}
      JAVA_OPTS_EXTRA: ${JAVA_OPTS_EXTRA:-}
      CAMPAIGN_CACHE_MODE: ${CAMPAIGN_CACHE_MODE:-local}
      CAMPAIGN_CACHE_TTL: ${CAMPAIGN_CACHE_TTL:-10m}
      CAMPAIGN_LOCAL_CACHE_TTL: ${CAMPAIGN_LOCAL_CACHE_TTL:-30s}
      CAMPAIGN_LOCAL_CACHE_MAX_SIZE: ${CAMPAIGN_LOCAL_CACHE_MAX_SIZE:-6000}
    volumes:
      - backend-logs:/logs
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 컨테이너 메모리를 줄이면 RAMPercentage 로 잡히는 힙도 같이 줄어든다.
          # CPU 수는 GC 워커 스레드 수를 결정하므로 같이 기록해 두고 비교한다.
          cpus: "${BACKEND_CPUS:-1.0}"
          memory: ${BACKEND_MEM_LIMIT:-1g}
        reservations:
          memory: ${BACKEND_MEM_LIMIT:-1g}

  # 두 번째 인스턴스. 로컬 캐시는 프로세스마다 따로 살기 때문에, 한쪽에서 바꾼 것이
  # 다른 쪽에 반영되는지는 인스턴스가 둘 이상이어야만 확인할 수 있다.
  #   docker compose --profile multi up -d backend2
  backend2:
    build: .
    profiles: ["multi"]
    environment: *backend-env
    volumes:
      - backend2-logs:/logs
    ports:
      - "${BACKEND2_PORT:-18082}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment-mock:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPUS:-1.0}"
          memory: ${BACKEND_MEM_LIMIT:-1g}

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["obs"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # 캐싱 단계를 며칠에 걸쳐 비교하려면 기준선 그래프가 남아 있어야 한다.
      # 볼륨이 없으면 컨테이너를 새로 만들 때마다 지난 측정이 통째로 날아간다.
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}"
    ports:
      - "${PROMETHEUS_PORT}:9090"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  loki:
    image: grafana/loki:3.3.2
    profiles: ["obs"]
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  alloy:
    image: grafana/alloy:v1.5.1
    profiles: ["obs"]
    environment:
      ALLOY_ENV: local
      TZ: Asia/Seoul
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - backend-logs:/logs:ro
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

volumes:
  mysql-data:
  grafana-data:
  prometheus-data:
  backend-logs:
  backend2-logs:
  loki-data:
  alloy-data:
