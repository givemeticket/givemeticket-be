services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          memory: 512m

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          memory: 256m

  payment-mock:
    build: ./payment-mock
    environment:
      PAYMENT_DELAY_MS: ${PAYMENT_DELAY_MS}
      PAYMENT_JITTER_MS: ${PAYMENT_JITTER_MS}
      PAYMENT_ERROR_RATE: ${PAYMENT_ERROR_RATE}
      PAYMENT_TIMEOUT_RATE: ${PAYMENT_TIMEOUT_RATE}
      PAYMENT_DECLINE_RATE: ${PAYMENT_DECLINE_RATE}
    ports:
      - "${PAYMENT_MOCK_PORT}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          memory: 128m

  backend:
    build: .
    environment:
      # dev 프로파일은 콘솔 + /logs/app/*.log 파일에 동시에 JSON 을 쓴다.
      # 파일이 있어야 obs 프로파일의 alloy 가 tail 할 수 있다.
      SPRING_PROFILES_ACTIVE: dev
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYMENT_BASE_URL: http://payment-mock:8081
      DB_POOL_SIZE: ${DB_POOL_SIZE}
    volumes:
      - backend-logs:/logs
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment-mock:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          memory: 512m

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["obs"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2h"
    ports:
      - "${PROMETHEUS_PORT}:9090"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  loki:
    image: grafana/loki:3.3.2
    profiles: ["obs"]
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  alloy:
    image: grafana/alloy:v1.5.1
    profiles: ["obs"]
    environment:
      ALLOY_ENV: local
      TZ: Asia/Seoul
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - backend-logs:/logs:ro
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

volumes:
  mysql-data:
  grafana-data:
  backend-logs:
  loki-data:
  alloy-data:
