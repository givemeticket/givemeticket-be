services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ./config/mysql.env
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  payment-mock:
    image: happyalsrl/givemeticket-payment-mock:release
    restart: unless-stopped
    pull_policy: always
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=55.0 -XX:+UseSerialGC -Xss512k"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    image: happyalsrl/givemeticket-be:release
    restart: unless-stopped
    pull_policy: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
    volumes:
      - ./config/application-prod.yml:/app/config/application-prod.yml:ro
    ports:
      - "80:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment-mock:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    env_file:
      - ./config/grafana.env
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
