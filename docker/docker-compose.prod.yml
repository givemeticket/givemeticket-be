services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ./config/mysql.env
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  payment-mock:
    image: ${DOCKER_NAMESPACE}/givemeticket:payment-mock
    restart: unless-stopped
    pull_policy: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    image: ${DOCKER_NAMESPACE}/givemeticket:backend
    restart: unless-stopped
    pull_policy: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
    volumes:
      - ./config/application-prod.yml:/app/config/application-prod.yml:ro
      - backend-logs:/logs
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment-mock:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - backend

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 384m

  # backend 가 쓰는 backend-logs 볼륨을 read-only 로 붙여 /logs/app/*.log 를 tail → Loki 로 push.
  alloy:
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    environment:
      ALLOY_ENV: prod
      TZ: Asia/Seoul
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - backend-logs:/logs:ro
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128m

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    env_file:
      - ./config/grafana.env
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: light
      GF_SERVER_ROOT_URL: "https://${DOMAIN:-api.givemeticket.site}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-api.givemeticket.site}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
      - grafana
    command:
      - /bin/sh
      - -c
      - |
        rm -f /etc/nginx/conf.d/default.conf
        while :; do sleep 6h & wait $${!}; nginx -s reload; done &
        exec /docker-entrypoint.sh nginx -g "daemon off;"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - nginx
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mysql-data:
  backend-logs:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
