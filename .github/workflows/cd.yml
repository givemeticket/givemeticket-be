name: Build & Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      service:
        description: '재배포할 서비스'
        required: true
        default: backend
        type: choice
        options: [ backend, payment-mock ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      payment-mock: ${{ steps.filter.outputs.payment-mock }}
      deploy-files: ${{ steps.filter.outputs.deploy-files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'src/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'Dockerfile'
              - 'gradle/**'
            payment-mock:
              - 'payment-mock/**'
            deploy-files:
              - 'docker/**'
              - 'observability/**'

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event.inputs.service == 'backend'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Build JAR (verify)
        run: ./gradlew clean build -x test --no-daemon --build-cache

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/givemeticket-be:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-payment-mock:
    needs: changes
    if: needs.changes.outputs.payment-mock == 'true' || github.event.inputs.service == 'payment-mock'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./payment-mock
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/givemeticket-payment-mock:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [ changes, build-backend, build-payment-mock ]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.payment-mock == 'true' ||
       needs.changes.outputs.deploy-files == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: [ self-hosted, prod ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch private config
        env:
          SUBMODULE_KEY: ${{ secrets.SUBMODULE_KEY }}
          CONFIG_REPO: ${{ vars.CONFIG_REPO }}
        run: |
          set -euo pipefail
          CONFIG_REPO="${CONFIG_REPO:-givemeticket/givemeticket-submodule}"
          rm -rf docker/config
          git clone --depth 1 \
            "https://x-access-token:${SUBMODULE_KEY}@github.com/${CONFIG_REPO}.git" \
            docker/config
          test -f docker/config/application-prod.yml
          test -f docker/config/mysql.env
          test -f docker/config/grafana.env

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Sync deploy files
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          DEPLOY_DIR="${DEPLOY_DIR:-$HOME/givemeticket-prod}"
          echo "📁 배포 디렉터리: $DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR/config"

          cp docker/docker-compose.prod.yml "$DEPLOY_DIR/docker-compose.yml"
          cp docker/deploy.sh               "$DEPLOY_DIR/deploy.sh"
          cp docker/config/application-prod.yml "$DEPLOY_DIR/config/application-prod.yml"
          cp docker/config/mysql.env            "$DEPLOY_DIR/config/mysql.env"
          cp docker/config/grafana.env          "$DEPLOY_DIR/config/grafana.env"
          rm -rf "$DEPLOY_DIR/observability"
          cp -R observability "$DEPLOY_DIR/observability"
          chmod +x "$DEPLOY_DIR/deploy.sh"

      - name: Deploy payment-mock
        if: needs.build-payment-mock.result == 'success'
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          DEPLOY_DIR="${DEPLOY_DIR:-$HOME/givemeticket-prod}"
          "$DEPLOY_DIR/deploy.sh" payment-mock

      - name: Deploy backend
        if: needs.build-backend.result == 'success' || needs.changes.outputs.deploy-files == 'true'
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          DEPLOY_DIR="${DEPLOY_DIR:-$HOME/givemeticket-prod}"
          "$DEPLOY_DIR/deploy.sh" backend
